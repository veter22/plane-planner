<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plané — Персональный планер</title>
  
  <!-- Внешние шрифты: Parisienne (французский рукописный для логотипа) и JetBrains Mono (для счетчиков) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              sky: '#0593C6',
              white: '#FCFFFF',
              pink: '#DB3996',
              bgDark: '#070b14',
              surfaceDark: '#0e1526'
            }
          },
          fontFamily: {
            sans: ['"Advaken Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            french: ['"Parisienne"', 'cursive']
          }
        }
      }
    }
  </script>

  <style>
    /* Подключение Advaken Sans: ищет файл в репозитории или в системе пользователя */
    @font-face {
      font-family: 'Advaken Sans';
      src: local('Advaken Sans Expanded'),
           local('Advaken Sans'),
           local('AdvakenSans-Expanded'),
           url('./AdvakenSans-Expanded.otf') format('opentype'),
           url('./AdvakenSans.otf') format('opentype'),
           url('./AdvakenSans.woff2') format('woff2'),
           url('./AdvakenSans.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    * {
      font-family: 'Advaken Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #070b14;
      color: #FCFFFF;
      font-family: 'Advaken Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* Анимированная сцена сияния (Aurora Mesh) */
    .aurora-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .aurora-blob {
      position: absolute;
      filter: blur(120px);
      opacity: 0.35;
      border-radius: 9999px;
      animation: floatSlow 22s infinite alternate ease-in-out;
    }
    .blob-1 {
      top: -15%;
      left: 15%;
      width: 55vw;
      height: 55vw;
      background: radial-gradient(circle, #0593C6 0%, rgba(5,147,198,0) 70%);
      animation-duration: 24s;
    }
    .blob-2 {
      bottom: -15%;
      right: 10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, #DB3996 0%, rgba(219,57,150,0) 70%);
      animation-duration: 28s;
      animation-delay: -5s;
    }
    .blob-3 {
      top: 35%;
      left: 45%;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, #0593C6 0%, rgba(219,57,150,0.3) 50%, rgba(5,147,198,0) 70%);
      animation-duration: 32s;
      animation-delay: -10s;
    }

    @keyframes floatSlow {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.08); }
      100% { transform: translate(-40px, 70px) scale(0.94); }
    }

    /* Многослойное стекло (Glassmorphism) */
    .luxury-glass {
      background: rgba(14, 21, 38, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(252, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(252, 255, 255, 0.1);
    }
    .luxury-card {
      background: rgba(18, 27, 49, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(252, 255, 255, 0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .luxury-card:hover {
      background: rgba(24, 35, 63, 0.7);
      border-color: rgba(5, 147, 198, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(5, 147, 198, 0.15);
    }

    /* Исключение: французский рукописный шрифт только для названия */
    .brand-logo {
      font-family: 'Parisienne', cursive !important;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 16px rgba(5, 147, 198, 0.4);
    }

    /* Моноширинный шрифт только для бейджей и счетчиков */
    .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }

    input, textarea, button, select {
      font-family: 'Advaken Sans', system-ui, -apple-system, sans-serif !important;
    }

    /* Кастомный тонкий скроллбар */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(252, 255, 255, 0.12); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(5, 147, 198, 0.4); }
  </style>
</head>

<body class="min-h-screen flex text-[#FCFFFF] antialiased selection:bg-[#DB3996]/30 selection:text-white">

  <!-- Фон со свечением -->
  <div class="aurora-bg">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
  </div>

  <!-- Боковое меню -->
  <aside class="w-72 h-screen luxury-glass border-r border-white/5 flex flex-col justify-between p-6 shrink-0 z-20">
    <div class="space-y-8">
      
      <!-- Логотип Plané -->
      <div class="flex items-center justify-between pb-4 border-b border-white/5">
        <div class="flex items-baseline gap-2.5">
          <span class="brand-logo text-4xl text-transparent bg-clip-text bg-gradient-to-r from-white via-[#FCFFFF] to-[#0593C6] select-none">
            Plané
          </span>
          <span class="text-[9px] font-mono uppercase tracking-widest text-[#0593C6] px-1.5 py-0.5 rounded border border-[#0593C6]/25 bg-[#0593C6]/10">
            v1.0
          </span>
        </div>
        <div class="w-2 h-2 rounded-full bg-[#0593C6] animate-pulse"></div>
      </div>

      <!-- Навигация -->
      <nav class="space-y-1.5 font-medium text-sm">
        <button onclick="switchView('list')" id="nav-list" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl transition bg-white/10 text-white font-medium">
          <div class="flex items-center gap-3">
            <svg class="w-4 h-4 text-[#0593C6]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
            </svg>
            <span>Задачи</span>
          </div>
          <span id="badge-tasks-count" class="text-xs font-mono text-white/50 px-2 py-0.5 rounded-md bg-white/5">0</span>
        </button>

        <button onclick="switchView('kanban')" id="nav-kanban" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl transition text-white/60 hover:text-white hover:bg-white/5">
          <div class="flex items-center gap-3">
            <svg class="w-4 h-4 text-white/40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
            </svg>
            <span>Канбан</span>
          </div>
        </button>

        <button onclick="switchView('notes')" id="nav-notes" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl transition text-white/60 hover:text-white hover:bg-white/5">
          <div class="flex items-center gap-3">
            <svg class="w-4 h-4 text-white/40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
            </svg>
            <span>Заметки</span>
          </div>
          <span id="badge-notes-count" class="text-xs font-mono text-white/50 px-2 py-0.5 rounded-md bg-white/5">0</span>
        </button>
      </nav>

      <!-- Раздел проектов -->
      <div class="space-y-3 pt-3">
        <div class="flex items-center justify-between px-1">
          <span class="text-[11px] font-mono uppercase tracking-widest text-white/40">Проекты</span>
          <button onclick="openProjectModal()" class="p-1 rounded-lg hover:bg-white/10 text-white/60 hover:text-white transition">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
          </button>
        </div>
        <div id="projects-list" class="space-y-1"></div>
      </div>
    </div>

    <!-- Профиль пользователя -->
    <div class="pt-4 border-t border-white/5">
      <div id="user-profile" class="flex items-center justify-between p-2.5 rounded-xl bg-white/[0.03] border border-white/5">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-[#0593C6] to-[#DB3996] flex items-center justify-center font-mono text-xs font-bold text-white shadow-lg shadow-[#0593C6]/20">
            P
          </div>
          <div class="leading-tight">
            <div id="user-display-name" class="text-xs font-medium text-white">Владелец</div>
            <div class="text-[10px] font-mono text-white/40">Локальный профиль</div>
          </div>
        </div>
        <button onclick="simulateTelegramLogin()" title="Подключить Telegram" class="p-1.5 rounded-lg hover:bg-white/10 text-[#0593C6] transition">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.52 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Основная область -->
  <main class="flex-1 h-screen overflow-y-auto flex flex-col p-8 lg:p-12">
    
    <header class="flex items-center justify-between pb-8">
      <div>
        <h1 id="view-title" class="text-2xl font-semibold tracking-tight text-white">Список задач</h1>
        <p id="view-subtitle" class="text-xs text-white/40 mt-1">Минималистичный персональный фокус</p>
      </div>
      <div class="flex items-center gap-3">
        <div class="relative">
          <input type="text" id="global-search" oninput="handleSearch(this.value)" placeholder="Поиск..." class="w-64 px-4 py-2 pl-9 text-xs rounded-xl luxury-card text-white placeholder-white/30 focus:outline-none focus:border-[#0593C6]/60">
          <svg class="w-3.5 h-3.5 absolute left-3 top-2.5 text-white/40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>
    </header>

    <!-- РЕЖИМ: СПИСОК -->
    <section id="view-list" class="space-y-6">
      <div class="luxury-glass p-2 pl-4 rounded-2xl flex items-center gap-3 border border-white/10 shadow-xl">
        <svg class="w-4 h-4 text-[#0593C6]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <input type="text" id="new-task-input" placeholder="Добавить новую задачу... (нажмите Enter)" class="bg-transparent flex-1 text-sm text-white placeholder-white/30 focus:outline-none" onkeydown="if(event.key==='Enter') createTask()">
        <button onclick="createTask()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-[#0593C6] to-[#0593C6]/80 hover:brightness-110 text-white text-xs font-semibold tracking-wide transition shadow-md shadow-[#0593C6]/20">
          Создать
        </button>
      </div>

      <div class="space-y-2" id="tasks-container"></div>
    </section>

    <!-- РЕЖИМ: КАНБАН -->
    <section id="view-kanban" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6 flex-1 items-start">
      <div class="luxury-glass p-4 rounded-2xl flex flex-col space-y-3">
        <div class="flex items-center justify-between pb-2 border-b border-white/5">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-white/40"></span>
            <span class="text-xs font-medium uppercase tracking-wider text-white/70">К выполнению</span>
          </div>
          <span id="count-kanban-todo" class="text-xs font-mono text-white/40">0</span>
        </div>
        <div id="kanban-todo" class="space-y-2 min-h-[400px]"></div>
      </div>

      <div class="luxury-glass p-4 rounded-2xl flex flex-col space-y-3">
        <div class="flex items-center justify-between pb-2 border-b border-white/5">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-[#0593C6]"></span>
            <span class="text-xs font-medium uppercase tracking-wider text-[#0593C6]">В процессе</span>
          </div>
          <span id="count-kanban-progress" class="text-xs font-mono text-white/40">0</span>
        </div>
        <div id="kanban-progress" class="space-y-2 min-h-[400px]"></div>
      </div>

      <div class="luxury-glass p-4 rounded-2xl flex flex-col space-y-3">
        <div class="flex items-center justify-between pb-2 border-b border-white/5">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-[#DB3996]"></span>
            <span class="text-xs font-medium uppercase tracking-wider text-[#DB3996]">Готово</span>
          </div>
          <span id="count-kanban-done" class="text-xs font-mono text-white/40">0</span>
        </div>
        <div id="kanban-done" class="space-y-2 min-h-[400px]"></div>
      </div>
    </section>

    <!-- РЕЖИМ: ЗАМЕТКИ -->
    <section id="view-notes" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
      <div class="lg:col-span-4 space-y-3">
        <button onclick="createNewNote()" class="w-full py-2.5 px-4 rounded-xl luxury-card text-xs font-medium text-white flex items-center justify-center gap-2 border-dashed hover:border-[#DB3996]/50 transition">
          <svg class="w-3.5 h-3.5 text-[#DB3996]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          Новая заметка
        </button>
        <div id="notes-list" class="space-y-2"></div>
      </div>

      <div class="lg:col-span-8 luxury-glass rounded-2xl p-6 flex flex-col space-y-4">
        <input type="text" id="active-note-title" placeholder="Заголовок заметки..." class="bg-transparent text-xl font-semibold text-white placeholder-white/30 focus:outline-none" oninput="saveCurrentNote()">
        <div class="h-[1px] w-full bg-white/5"></div>
        <textarea id="active-note-content" placeholder="Начните писать мысли, проектный документ или лонгрид..." class="flex-1 bg-transparent text-sm leading-relaxed text-white/80 placeholder-white/30 focus:outline-none resize-none font-sans" oninput="saveCurrentNote()"></textarea>
      </div>
    </section>

  </main>

  <!-- Модальное окно создания проекта -->
  <div id="modal-project" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="luxury-glass p-6 rounded-2xl w-full max-w-sm space-y-4 border border-white/10">
      <h3 class="text-base font-semibold text-white">Новый проект</h3>
      <input type="text" id="project-title-input" placeholder="Название (например, Дизайн, Учеба)" class="w-full px-3.5 py-2.5 text-xs rounded-xl luxury-card text-white placeholder-white/30 focus:outline-none focus:border-[#0593C6]/60">
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeProjectModal()" class="px-3.5 py-1.5 rounded-xl text-xs text-white/60 hover:text-white transition">Отмена</button>
        <button onclick="confirmCreateProject()" class="px-4 py-1.5 rounded-xl text-xs font-medium bg-[#0593C6] text-white hover:brightness-110 transition">Создать</button>
      </div>
    </div>
  </div>

  <!-- Toast уведомления -->
  <div id="toast" class="fixed bottom-6 right-6 luxury-glass px-4 py-3 rounded-xl text-xs flex items-center gap-3 border border-white/10 shadow-2xl transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50">
    <div id="toast-indicator" class="w-2 h-2 rounded-full bg-[#0593C6]"></div>
    <span id="toast-message" class="text-white">Уведомление</span>
  </div>

  <script>
    let state = {
      projects: JSON.parse(localStorage.getItem('plane_projects')) || [
        { id: 'p1', title: 'Личное' },
        { id: 'p2', title: 'Работа' }
      ],
      tasks: JSON.parse(localStorage.getItem('plane_tasks')) || [
        { id: 't1', title: 'Опубликовать планер на GitHub Pages', status: 'done', project: 'p2' },
        { id: 't2', title: 'Настроить французскую типографику Plané', status: 'done', project: 'p1' },
        { id: 't3', title: 'Подключить Telegram Auth для удаленного доступа', status: 'progress', project: 'p2' }
      ],
      notes: JSON.parse(localStorage.getItem('plane_notes')) || [
        { id: 'n1', title: 'Архитектурный план Plané', content: 'Цель: сделать легкий и быстрый персональный планер без перегрузки кнопками.\n\nЭстетика: Parisienne + Advaken Sans, глубокий темный фон, акценты небесно-голубого и ярко-розового.' }
      ],
      activeProject: 'all',
      activeNoteId: null,
      searchQuery: ''
    };

    function saveState() {
      localStorage.setItem('plane_projects', JSON.stringify(state.projects));
      localStorage.setItem('plane_tasks', JSON.stringify(state.tasks));
      localStorage.setItem('plane_notes', JSON.stringify(state.notes));
      updateCounts();
    }

    function showToast(msg, color = '#0593C6') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      const toastInd = document.getElementById('toast-indicator');
      toastMsg.innerText = msg;
      toastInd.style.backgroundColor = color;
      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
      }, 2500);
    }

    function switchView(view) {
      ['list', 'kanban', 'notes'].forEach(v => {
        document.getElementById(`view-${v}`).classList.add('hidden');
        const nav = document.getElementById(`nav-${v}`);
        nav.classList.remove('bg-white/10', 'text-white');
        nav.classList.add('text-white/60');
      });
      document.getElementById(`view-${view}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${view}`);
      activeNav.classList.add('bg-white/10', 'text-white');
      activeNav.classList.remove('text-white/60');

      const titles = {
        list: ['Список задач', 'Единый центр задач с быстрым добавлением'],
        kanban: ['Канбан-доска', 'Визуализация текущих потоков'],
        notes: ['Заметки и лонгриды', 'Чистый холст для записей и идей']
      };
      document.getElementById('view-title').innerText = titles[view][0];
      document.getElementById('view-subtitle').innerText = titles[view][1];

      if (view === 'kanban') renderKanban();
      if (view === 'notes') renderNotes();
    }

    function renderProjects() {
      const container = document.getElementById('projects-list');
      container.innerHTML = `
        <button onclick="filterProject('all')" class="w-full text-left px-3 py-1.5 rounded-lg text-xs font-medium transition ${state.activeProject === 'all' ? 'text-white bg-white/5' : 'text-white/50 hover:text-white'}">
          Все проекты
        </button>
      `;
      state.projects.forEach(p => {
        const btn = document.createElement('button');
        btn.className = `w-full text-left px-3 py-1.5 rounded-lg text-xs font-medium flex items-center justify-between transition ${state.activeProject === p.id ? 'text-[#0593C6] bg-[#0593C6]/10' : 'text-white/50 hover:text-white'}`;
        btn.innerHTML = `<span>${p.title}</span>`;
        btn.onclick = () => filterProject(p.id);
        container.appendChild(btn);
      });
    }

    function filterProject(id) {
      state.activeProject = id;
      renderProjects();
      renderTasks();
      renderKanban();
    }

    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';

      let filtered = state.tasks;
      if (state.activeProject !== 'all') {
        filtered = filtered.filter(t => t.project === state.activeProject);
      }
      if (state.searchQuery) {
        filtered = filtered.filter(t => t.title.toLowerCase().includes(state.searchQuery.toLowerCase()));
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-xs text-white/30 luxury-card rounded-2xl">Задач пока нет</div>`;
        return;
      }

      filtered.forEach(task => {
        const item = document.createElement('div');
        item.className = 'luxury-card p-3.5 rounded-xl flex items-center justify-between gap-4 group';
        const isDone = task.status === 'done';
        item.innerHTML = `
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <button onclick="toggleTaskStatus('${task.id}')" class="w-4 h-4 rounded border transition flex items-center justify-center ${isDone ? 'bg-[#DB3996] border-[#DB3996]' : 'border-white/30 hover:border-[#0593C6]'}">
              ${isDone ? '<svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>' : ''}
            </button>
            <span class="text-xs truncate ${isDone ? 'line-through text-white/30' : 'text-white'}">${task.title}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-mono px-2 py-0.5 rounded-full ${task.status === 'progress' ? 'bg-[#0593C6]/20 text-[#0593C6]' : task.status === 'done' ? 'bg-[#DB3996]/20 text-[#DB3996]' : 'bg-white/5 text-white/40'}">
              ${task.status === 'progress' ? 'в процессе' : task.status === 'done' ? 'готово' : 'к выполнению'}
            </span>
            <button onclick="deleteTask('${task.id}')" class="opacity-0 group-hover:opacity-100 p-1 text-white/40 hover:text-white transition">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function createTask() {
      const input = document.getElementById('new-task-input');
      const val = input.value.trim();
      if (!val) return;
      state.tasks.unshift({
        id: 't_' + Date.now(),
        title: val,
        status: 'todo',
        project: state.activeProject === 'all' ? (state.projects[0]?.id || 'p1') : state.activeProject
      });
      input.value = '';
      saveState();
      renderTasks();
      showToast('Задача добавлена в Plané');
    }

    function toggleTaskStatus(id) {
      const t = state.tasks.find(x => x.id === id);
      if (t) {
        t.status = t.status === 'done' ? 'todo' : 'done';
        saveState();
        renderTasks();
        renderKanban();
      }
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(x => x.id !== id);
      saveState();
      renderTasks();
      renderKanban();
    }

    function renderKanban() {
      const cols = { todo: document.getElementById('kanban-todo'), progress: document.getElementById('kanban-progress'), done: document.getElementById('kanban-done') };
      Object.values(cols).forEach(c => c.innerHTML = '');
      
      const counts = { todo: 0, progress: 0, done: 0 };
      let filtered = state.tasks;
      if (state.activeProject !== 'all') filtered = filtered.filter(t => t.project === state.activeProject);

      filtered.forEach(t => {
        counts[t.status]++;
        const card = document.createElement('div');
        card.className = 'luxury-card p-3 rounded-xl space-y-2 cursor-pointer';
        card.innerHTML = `
          <div class="text-xs text-white">${t.title}</div>
          <div class="flex items-center justify-between pt-1">
            <span class="text-[9px] font-mono text-white/30">${state.projects.find(p => p.id === t.project)?.title || 'Проект'}</span>
            <div class="flex gap-1">
              ${t.status !== 'todo' ? `<button onclick="moveTask('${t.id}', 'todo')" class="text-[9px] px-1.5 py-0.5 rounded bg-white/5 hover:bg-white/10 text-white/60">←</button>` : ''}
              ${t.status !== 'progress' ? `<button onclick="moveTask('${t.id}', 'progress')" class="text-[9px] px-1.5 py-0.5 rounded bg-[#0593C6]/10 text-[#0593C6]">●</button>` : ''}
              ${t.status !== 'done' ? `<button onclick="moveTask('${t.id}', 'done')" class="text-[9px] px-1.5 py-0.5 rounded bg-white/5 hover:bg-white/10 text-white/60">→</button>` : ''}
            </div>
          </div>
        `;
        cols[t.status].appendChild(card);
      });

      document.getElementById('count-kanban-todo').innerText = counts.todo;
      document.getElementById('count-kanban-progress').innerText = counts.progress;
      document.getElementById('count-kanban-done').innerText = counts.done;
    }

    function moveTask(id, newStatus) {
      const t = state.tasks.find(x => x.id === id);
      if (t) {
        t.status = newStatus;
        saveState();
        renderKanban();
        renderTasks();
      }
    }

    function renderNotes() {
      const list = document.getElementById('notes-list');
      list.innerHTML = '';
      state.notes.forEach(n => {
        const item = document.createElement('div');
        item.className = `luxury-card p-3 rounded-xl cursor-pointer transition ${state.activeNoteId === n.id ? 'border-[#0593C6]/60 bg-white/10' : ''}`;
        item.onclick = () => selectNote(n.id);
        item.innerHTML = `
          <div class="text-xs font-medium text-white truncate">${n.title || 'Без названия'}</div>
          <div class="text-[10px] text-white/40 truncate mt-0.5">${n.content || 'Пустая заметка'}</div>
        `;
        list.appendChild(item);
      });

      if (!state.activeNoteId && state.notes.length > 0) {
        selectNote(state.notes[0].id);
      }
    }

    function selectNote(id) {
      state.activeNoteId = id;
      const note = state.notes.find(n => n.id === id);
      if (note) {
        document.getElementById('active-note-title').value = note.title;
        document.getElementById('active-note-content').value = note.content;
      }
      renderNotes();
    }

    function createNewNote() {
      const newNote = {
        id: 'n_' + Date.now(),
        title: 'Новая заметка',
        content: ''
      };
      state.notes.unshift(newNote);
      saveState();
      selectNote(newNote.id);
      showToast('Заметка создана', '#DB3996');
    }

    function saveCurrentNote() {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      if (note) {
        note.title = document.getElementById('active-note-title').value;
        note.content = document.getElementById('active-note-content').value;
        saveState();
        renderNotes();
      }
    }

    function updateCounts() {
      document.getElementById('badge-tasks-count').innerText = state.tasks.filter(t => t.status !== 'done').length;
      document.getElementById('badge-notes-count').innerText = state.notes.length;
    }

    function openProjectModal() {
      document.getElementById('modal-project').classList.remove('hidden');
      document.getElementById('project-title-input').focus();
    }

    function closeProjectModal() {
      document.getElementById('modal-project').classList.add('hidden');
      document.getElementById('project-title-input').value = '';
    }

    function confirmCreateProject() {
      const input = document.getElementById('project-title-input');
      const val = input.value.trim();
      if (!val) return;
      state.projects.push({ id: 'p_' + Date.now(), title: val });
      saveState();
      renderProjects();
      closeProjectModal();
      showToast(`Проект «${val}» создан`);
    }

    function handleSearch(val) {
      state.searchQuery = val;
      renderTasks();
    }

    function simulateTelegramLogin() {
      showToast('Telegram Auth: сессия сохранена локально', '#0593C6');
      document.getElementById('user-display-name').innerText = '@telegram_user';
    }

    // Инициализация при старте
    renderProjects();
    renderTasks();
    updateCounts();
  </script>
</body>
</html>
